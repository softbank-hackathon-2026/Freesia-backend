# 로컬 개발용: docker compose up --build
# 서버에서 DB를 어떻게 둘지(Compose / RDS / SQLite)는 ADR-007에서 결정합니다.
services:
  backend:
    build:
      context: .
      args:
        GIT_SHA: local
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: freesia
      POSTGRES_PASSWORD: freesia
      POSTGRES_DB: freesia
    volumes:
      - db-data:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freesia -d freesia"]
      interval: 3s
      timeout: 3s
      retries: 10
    # DB 포트는 외부에 열지 않는다. 로컬에서 직접 접속이 필요하면 아래 주석 해제
    # ports:
    #   - "5432:5432"

volumes:
  db-data:
